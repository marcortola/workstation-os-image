# EDITOR for everything the graphical session spawns. Fish exports EDITOR too,
# but herdr is launched from a niri keybind and never sources config.fish, so
# its prefix+e ("open this pane's scrollback in $EDITOR") would have no editor
# to reach for. The path is absolute because Homebrew's bin is not on the
# compositor's PATH -- the niri binds reference brew binaries the same way.
EDITOR=/home/linuxbrew/.linuxbrew/bin/nvim
VISUAL=/home/linuxbrew/.linuxbrew/bin/nvim

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Bumps the digest-pinned inputs on LITERAL FROM lines -- currently the brew
  # stage. This parser is a regex over FROM, so it cannot see the base, which
  # lives in ARG BASE_IMAGE; .github/renovate.json5 owns that one.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

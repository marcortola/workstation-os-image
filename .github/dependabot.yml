version: 2
updates:
  # Bumps digest-pinned inputs on literal FROM lines. ARG BASE_IMAGE is
  # managed by .github/renovate.json5 because Dependabot cannot parse it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Europe/Madrid"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Europe/Madrid"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

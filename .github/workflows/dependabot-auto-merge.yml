name: Dependabot delta audit and auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: dependabot-audit-${{ github.repository }}-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  classify:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      ghsa-id: ${{ steps.metadata.outputs.ghsa-id }}
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      title-major: ${{ steps.title_major.outputs.major }}
    steps:
      # Titles come in several shapes and the version transition has to be read out of all
      # of them, because fetch-metadata reports only the highest update type in a group:
      #   bump foo from 1.2.3 to 1.3.0                      -> minor
      #   bump foo from v4 to v7                            -> major
      #   update foo requirement from ~> 4.0 to ~> 5.24     -> major  (operator prefix)
      #   bump foo from `bed0568` to `d52b3f5`              -> digest, not semver
      - name: Classify title version transition
        id: title_major
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = String.raw`(?:[~^><=!]*\s*)?v?(\d+)(?:\.\d+){0,3}(?:[-+][0-9A-Za-z.-]+)?`;
          const match = process.env.PR_TITLE.match(
            new RegExp(String.raw`\bfrom\s+${version}\s+to\s+${version}`, 'i'),
          );
          const major = match !== null && Number(match[1]) !== Number(match[2]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `major=${major}\n`);
          NODE

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

  # A major that carries no advisory is silenced permanently, so Dependabot stops
  # recreating it on every run. A major that fixes an advisory is only closed and
  # labelled: the permanent ignore would also swallow later security majors for the
  # same dependency, and the Dependabot alert stays as the record.
  reject-major:
    needs: classify
    if: >-
      needs.classify.outputs.title-major == 'true' ||
      needs.classify.outputs.update-type == 'version-update:semver-major'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Silence non-security major
        if: >-
          needs.classify.outputs.ghsa-id == '' &&
          needs.classify.outputs.title-major == 'true'
        run: gh pr comment "$PR_URL" --body '@dependabot ignore this major version'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      # Grouped or unparseable titles cannot be targeted by "ignore this major
      # version", so the pull request is closed without a permanent ignore.
      - name: Close unparseable major
        if: >-
          needs.classify.outputs.ghsa-id == '' &&
          needs.classify.outputs.title-major != 'true'
        run: gh pr close "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Close and label security major
        if: needs.classify.outputs.ghsa-id != ''
        run: |
          gh label create security-major-declined \
            --description 'Major security update closed by automation; triage the Dependabot alert' \
            --color B60205 --force
          gh pr edit "$PR_URL" --add-label security-major-declined
          gh pr close "$PR_URL" --comment \
            "Closed by automation: this is a major version bump, which this repository does not take automatically. The advisory ($GHSA_ID) remains open as a Dependabot alert and needs manual triage."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GHSA_ID: ${{ needs.classify.outputs.ghsa-id }}

  audit:
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      needs.classify.outputs.title-major != 'true' &&
      (needs.classify.outputs.update-type == 'version-update:semver-patch' ||
      needs.classify.outputs.update-type == 'version-update:semver-minor')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create protected audit workspace
        run: mkdir .dependabot-audit

      - name: Check out base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Nothing in this job may install or build the candidate tree: the job runs with
      # base-branch privileges, so a dependency lifecycle script would execute against a
      # write-capable token. OSV-Scanner only parses lockfiles. Build verification belongs
      # in the pull_request-triggered workflow that the merge gate below waits on.
      - name: Check out Dependabot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Scan base dependencies
        id: scan-base
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output=.dependabot-audit/base.json
            --recursive
            base/

      - name: Scan candidate dependencies
        id: scan-candidate
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output=.dependabot-audit/candidate.json
            --recursive
            candidate/

      - name: Validate scanner output
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['.dependabot-audit/base.json', '.dependabot-audit/candidate.json']) {
            if (!fs.existsSync(path)) throw new Error(`OSV Scanner produced no output: ${path}`);
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(report.results)) throw new Error(`Invalid OSV Scanner output: ${path}`);
          }
          NODE

      - name: Compare vulnerability findings
        uses: google/osv-scanner-action/osv-reporter-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --output=.dependabot-audit/delta.sarif
            --old=.dependabot-audit/base.json
            --new=.dependabot-audit/candidate.json
            --gh-annotations=true
            --fail-on-vuln=false

      - name: Block introduced high or critical vulnerabilities
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sarif = JSON.parse(fs.readFileSync('.dependabot-audit/delta.sarif', 'utf8'));
          const blocking = [];
          for (const run of sarif.runs ?? []) {
            const rules = run.tool?.driver?.rules ?? [];
            for (const result of run.results ?? []) {
              const rule = rules[result.ruleIndex] ?? rules.find((entry) => entry.id === result.ruleId);
              const score = Number(rule?.properties?.['security-severity'] ?? 0);
              if (score >= 7) blocking.push(`${result.ruleId} (${score})`);
            }
          }
          if (blocking.length > 0) {
            throw new Error(`Introduced high/critical vulnerabilities: ${[...new Set(blocking)].join(', ')}`);
          }
          NODE

  # The OSV delta only answers "does this introduce a known vulnerability". It says
  # nothing about whether the tree still builds, and it is blind to the terraform,
  # devcontainers, github-actions and Dockerfile ecosystems entirely. The repository's
  # own pull_request checks are the correctness gate, so wait for every check that does
  # not belong to this workflow before merging anything.
  wait-for-checks:
    needs:
      - classify
      - audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
      pull-requests: read
      statuses: read
    steps:
      - name: Require the repository's own checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SELF_WORKFLOW: Dependabot delta audit and auto-merge
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const TIMEOUT_MS = 40 * 60 * 1000;
          const POLL_MS = 20 * 1000;
          const deadline = Date.now() + TIMEOUT_MS;
          const self = process.env.SELF_WORKFLOW;
          const prUrl = process.env.PR_URL;

          const sleep = (ms) => Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, ms);

          function poll() {
            // gh exits non-zero when checks are pending or failing, so the status is read
            // from the payload rather than from the exit code.
            let raw;
            try {
              raw = execFileSync('gh', ['pr', 'checks', prUrl, '--json', 'name,state,bucket,workflow'], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe'],
              });
            } catch (error) {
              raw = error.stdout;
            }
            if (!raw || !raw.trim()) return [];
            return JSON.parse(raw);
          }

          while (true) {
            const others = poll().filter((check) => check.workflow !== self);

            if (others.length === 0) {
              console.log('::warning::No pull_request checks are attached to this pull request, so nothing gates this merge beyond the vulnerability audit. Add a pull_request-triggered build to this repository.');
              break;
            }

            const failed = others.filter((check) => check.bucket === 'fail' || check.bucket === 'cancel');
            if (failed.length > 0) {
              const names = failed.map((check) => `${check.workflow}/${check.name}=${check.state}`).join(', ');
              console.log(`::error::Repository checks failed, refusing to merge this dependency update: ${names}`);
              process.exit(1);
            }

            const pending = others.filter((check) => check.bucket === 'pending');
            if (pending.length === 0) {
              console.log(`All ${others.length} repository check(s) passed.`);
              break;
            }

            if (Date.now() >= deadline) {
              const names = pending.map((check) => `${check.workflow}/${check.name}`).join(', ');
              console.log(`::error::Timed out waiting for ${pending.length} pending check(s): ${names}`);
              process.exit(1);
            }

            console.log(`Waiting for ${pending.length} of ${others.length} check(s)...`);
            sleep(POLL_MS);
          }
          NODE

  auto-merge:
    needs:
      - classify
      - audit
      - wait-for-checks
    if: >-
      needs.wait-for-checks.result == 'success' &&
      (needs.classify.outputs.update-type == 'version-update:semver-patch' ||
      needs.classify.outputs.update-type == 'version-update:semver-minor')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A stale branch cannot be squashed, and no amount of retrying fixes that: only
      # Dependabot can rebase its own branch. Ask it to, and let the resulting
      # synchronize event run this workflow again from the top.
      - name: Squash-merge audited update
        run: |
          if gh pr merge --squash "$PR_URL"; then
            exit 0
          fi

          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus || echo UNKNOWN)
          echo "Merge failed with mergeStateStatus=$state"

          case "$state" in
            BEHIND)
              gh pr comment "$PR_URL" --body '@dependabot rebase'
              echo "::notice::Branch was behind the base; asked Dependabot to rebase."
              ;;
            DIRTY)
              echo "::error::Branch conflicts with the base branch and needs manual attention."
              ;;
          esac

          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

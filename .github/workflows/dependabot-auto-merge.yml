name: Dependabot delta audit and auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: dependabot-audit-${{ github.repository }}-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  classify:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      ghsa-id: ${{ steps.metadata.outputs.ghsa-id }}
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      title-major: ${{ steps.title_major.outputs.major }}
      zerover-minor: ${{ steps.zerover.outputs.zerover-minor }}
      zerover-names: ${{ steps.zerover.outputs.zerover-names }}
    steps:
      # Titles come in several shapes and the version transition has to be read out of all
      # of them, because fetch-metadata reports only the highest update type in a group:
      #   bump foo from 1.2.3 to 1.3.0                      -> minor
      #   bump foo from v4 to v7                            -> major
      #   update foo requirement from ~> 4.0 to ~> 5.24     -> major  (operator prefix)
      #   bump foo from `bed0568` to `d52b3f5`              -> digest, not semver
      - name: Classify title version transition
        id: title_major
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = String.raw`(?:[~^><=!]*\s*)?v?(\d+)(?:\.\d+){0,3}(?:[-+][0-9A-Za-z.-]+)?`;
          const match = process.env.PR_TITLE.match(
            new RegExp(String.raw`\bfrom\s+${version}\s+to\s+${version}`, 'i'),
          );
          const major = match !== null && Number(match[1]) !== Number(match[2]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `major=${major}\n`);
          NODE

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # Dependabot classifies a version transition positionally, so 0.10.0 -> 0.13.0 keeps its
      # first component at 0 and is reported as version-update:semver-minor. The repository's
      # semver-major ignore therefore never fires, even though under semver every 0.x minor is
      # a breaking release. Dependabot compounds this by rewriting the manifest constraint, and
      # every ecosystem here pins pre-1.0 the same way: "^0.10.0" resolves >=0.10.0 <0.11.0 in
      # composer, npm and cargo alike, so the manifest would have refused the new version on its
      # own. Dependabot rewrote it to "^0.13.0" - the caret guard removed by the very bot it
      # should have constrained. That is how symfony/mcp-bundle 0.13.0 reached production and
      # 500'd every route of mencoro-app-backend for ~14 hours on 2026-09-14.
      #
      # updated-dependencies-json carries prevVersion/newVersion per dependency, so this also
      # sees a pre-1.0 bump buried inside a grouped pull request, which the title regex above
      # cannot parse.
      - name: Flag pre-1.0 minor bumps
        id: zerover
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          let dependencies = [];
          try {
            dependencies = JSON.parse(process.env.UPDATED_DEPENDENCIES || '[]');
          } catch {
            dependencies = [];
          }
          if (!Array.isArray(dependencies)) dependencies = [];

          // Strip any constraint operator ("~> 0.5", "^0.10.0") before reading the components.
          const components = (value) => String(value ?? '')
            .replace(/^[^0-9]*/, '')
            .split('.')
            .map((part) => Number.parseInt(part, 10));

          const breaking = dependencies.filter((dependency) => {
            const [prevMajor, prevMinor] = components(dependency.prevVersion);
            const [nextMajor, nextMinor] = components(dependency.newVersion);

            // An unparseable destination (a digest bump, say) carries no semver meaning at all.
            if (!Number.isInteger(nextMajor) || !Number.isInteger(nextMinor)) return false;

            // Anything at 1.0.0 or above is ordinary semver and handled by update-type.
            if (nextMajor !== 0) return false;

            // The destination is pre-1.0. The origin is not always knowable: fetch-metadata
            // derives prevVersion by parsing "Updates `name` from X to Y" out of the pull request
            // body and falls back to '' when the body says only "Updates `name` to Y", which
            // Dependabot does write. Treating unknown as safe would let exactly the kind of bump
            // this gate exists to stop through in silence, so an unknown origin is held: for a
            // pre-1.0 dependency the reviewer should be the one deciding it was harmless.
            if (!Number.isInteger(prevMajor) || !Number.isInteger(prevMinor)) return true;

            // A known origin outside 0.x means this is a downgrade into pre-1.0 rather than a
            // minor step within it - a shape worth a human's eyes on its own.
            if (prevMajor !== 0) return true;

            return prevMinor !== nextMinor;
          });

          const names = breaking
            .map((d) => `${d.dependencyName} ${d.prevVersion || '(unknown)'} -> ${d.newVersion}`)
            .join(', ');

          console.log(breaking.length > 0
            ? `Pre-1.0 minor bump(s) found, auto-merge will be withheld: ${names}`
            : 'No pre-1.0 minor bumps in this update.');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `zerover-minor=${breaking.length > 0}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `zerover-names=${names}\n`);
          NODE

  # A major that carries no advisory is silenced permanently, so Dependabot stops
  # recreating it on every run. A major that fixes an advisory is only closed and
  # labelled: the permanent ignore would also swallow later security majors for the
  # same dependency, and the Dependabot alert stays as the record.
  reject-major:
    needs: classify
    if: >-
      needs.classify.outputs.title-major == 'true' ||
      needs.classify.outputs.update-type == 'version-update:semver-major'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # Dependabot's own comment-command handler checks the commenter's actual
      # collaborator permission level, not the Actions token's granted scopes.
      # github-actions[bot] posting via the default token is never recognized as
      # having push access - Dependabot replies "Sorry, only users with push access
      # can use that command." and the ignore never takes effect. Observed in
      # production: every major this step ran on stayed open indefinitely instead
      # of being silenced, which is worse than the "gh pr close" churn this
      # mechanism was built to replace.
      #
      # Post the comment anyway - if a DEPENDABOT_COMMAND_TOKEN secret (a PAT
      # belonging to a real collaborator) is ever added, this starts silencing
      # majors permanently with no other change needed - but always close the pull
      # request too, so a rejected comment does not leave it sitting open.
      - name: Silence non-security major
        if: >-
          needs.classify.outputs.ghsa-id == '' &&
          needs.classify.outputs.title-major == 'true'
        run: |
          gh pr comment "$PR_URL" --body '@dependabot ignore this major version' || true
          gh pr close "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_COMMAND_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      # Grouped or unparseable titles cannot be targeted by "ignore this major
      # version", so the pull request is closed without a permanent ignore.
      - name: Close unparseable major
        if: >-
          needs.classify.outputs.ghsa-id == '' &&
          needs.classify.outputs.title-major != 'true'
        run: gh pr close "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Close and label security major
        if: needs.classify.outputs.ghsa-id != ''
        run: |
          gh label create security-major-declined \
            --description 'Major security update closed by automation; triage the Dependabot alert' \
            --color B60205 --force
          gh pr edit "$PR_URL" --add-label security-major-declined
          gh pr close "$PR_URL" --comment \
            "Closed by automation: this is a major version bump, which this repository does not take automatically. The advisory ($GHSA_ID) remains open as a Dependabot alert and needs manual triage."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GHSA_ID: ${{ needs.classify.outputs.ghsa-id }}

  audit:
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      needs.classify.outputs.title-major != 'true' &&
      (needs.classify.outputs.update-type == 'version-update:semver-patch' ||
      needs.classify.outputs.update-type == 'version-update:semver-minor')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create protected audit workspace
        run: mkdir .dependabot-audit

      - name: Check out base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # Nothing in this job may install or build the candidate tree: the job runs with
      # base-branch privileges, so a dependency lifecycle script would execute against a
      # write-capable token. OSV-Scanner only parses lockfiles. Build verification belongs
      # in the pull_request-triggered workflow that the merge gate below waits on.
      - name: Check out Dependabot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Scan base dependencies
        id: scan-base
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output=.dependabot-audit/base.json
            --recursive
            base/

      - name: Scan candidate dependencies
        id: scan-candidate
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output=.dependabot-audit/candidate.json
            --recursive
            candidate/

      - name: Validate scanner output
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['.dependabot-audit/base.json', '.dependabot-audit/candidate.json']) {
            if (!fs.existsSync(path)) throw new Error(`OSV Scanner produced no output: ${path}`);
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(report.results)) throw new Error(`Invalid OSV Scanner output: ${path}`);
          }
          NODE

      - name: Compare vulnerability findings
        uses: google/osv-scanner-action/osv-reporter-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --output=.dependabot-audit/delta.sarif
            --old=.dependabot-audit/base.json
            --new=.dependabot-audit/candidate.json
            --gh-annotations=true
            --fail-on-vuln=false

      - name: Block introduced high or critical vulnerabilities
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sarif = JSON.parse(fs.readFileSync('.dependabot-audit/delta.sarif', 'utf8'));
          const blocking = [];
          for (const run of sarif.runs ?? []) {
            const rules = run.tool?.driver?.rules ?? [];
            for (const result of run.results ?? []) {
              const rule = rules[result.ruleIndex] ?? rules.find((entry) => entry.id === result.ruleId);
              const score = Number(rule?.properties?.['security-severity'] ?? 0);
              if (score >= 7) blocking.push(`${result.ruleId} (${score})`);
            }
          }
          if (blocking.length > 0) {
            throw new Error(`Introduced high/critical vulnerabilities: ${[...new Set(blocking)].join(', ')}`);
          }
          NODE

  # The OSV delta only answers "does this introduce a known vulnerability". It says
  # nothing about whether the tree still builds, and it is blind to the terraform,
  # devcontainers, github-actions and Dockerfile ecosystems entirely. The repository's
  # own pull_request checks are the correctness gate, so wait for every check that does
  # not belong to this workflow before merging anything.
  wait-for-checks:
    needs:
      - classify
      - audit
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      pull-requests: read
      statuses: read
    steps:
      - name: Require the repository's own checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_WORKFLOW: Dependabot delta audit and auto-merge
          SECURITY_ADVISORY: ${{ needs.classify.outputs.ghsa-id }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const TIMEOUT_MS = 40 * 60 * 1000;
          const POLL_MS = 20 * 1000;
          const FAILED = new Set(['failure', 'cancelled', 'timed_out', 'action_required']);
          const deadline = Date.now() + TIMEOUT_MS;
          const self = process.env.SELF_WORKFLOW;
          const prUrl = process.env.PR_URL;
          const repo = process.env.REPO;
          const headSha = process.env.HEAD_SHA;
          const baseSha = process.env.BASE_SHA;
          const securityAdvisory = process.env.SECURITY_ADVISORY || '';

          const sleep = (ms) => Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, ms);

          // gh exits non-zero both when checks are pending or failing and when the call
          // itself fails, so the exit code cannot separate "the payload says pending" from
          // "there is no payload". Callers get whatever stdout was produced and decide for
          // themselves; the readers below return null for anything they cannot parse, and
          // every caller treats null as "unknown", which keeps this job waiting.
          function gh(args) {
            try {
              return execFileSync('gh', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            } catch (error) {
              return error.stdout || '';
            }
          }

          function ghJson(args) {
            const raw = gh(args);
            if (!raw.trim()) return null;
            try {
              return JSON.parse(raw);
            } catch {
              return null;
            }
          }

          function prChecks() {
            const parsed = ghJson(['pr', 'checks', prUrl, '--json', 'name,state,bucket,workflow']);
            return Array.isArray(parsed) ? parsed : null;
          }

          // A workflow run exists from the moment it is queued, but its check runs attach
          // only once its jobs start, so there is a window in which a build is already on
          // its way and `gh pr checks` still reports nothing for it. The run list closes
          // that window: a queued or in-progress run is work this job has to wait for,
          // whether or not a check has appeared for it yet. Runs of this workflow are
          // excluded by name; they are keyed to the base commit anyway, because
          // pull_request_target runs never carry the pull request's head sha.
          function headRuns() {
            const payload = ghJson([
              'api', `repos/${repo}/actions/runs?head_sha=${headSha}&per_page=100`,
            ]);
            if (payload === null || !Array.isArray(payload.workflow_runs)) return null;
            return payload.workflow_runs.map((run) => ({
              name: run.name,
              status: run.status,
              conclusion: run.conclusion ?? '',
            }));
          }

          // A check that was already red on the commit this branch forks from was not broken
          // by this update, and blocking on it would stall every dependency bump - security
          // ones included - for as long as the default branch stays red. Only regressions
          // this pull request actually introduced should block the merge. This is the same
          // base-versus-candidate reasoning the vulnerability audit above applies. An
          // unreadable base is treated as "nothing was red there", so a failing check counts
          // as a regression and the merge is refused.
          let baseRedCache = null;
          function baseRed() {
            if (baseRedCache) return baseRedCache;
            baseRedCache = new Set();
            const payload = ghJson([
              'api', `repos/${repo}/commits/${baseSha}/check-runs?per_page=100`,
            ]);
            if (payload === null || !Array.isArray(payload.check_runs)) {
              console.log(`::warning::Could not read the check runs of base commit ${baseSha}; treating every failing check as a regression.`);
              return baseRedCache;
            }
            for (const run of payload.check_runs) {
              if (FAILED.has(run.conclusion ?? 'pending')) baseRedCache.add(run.name);
            }
            return baseRedCache;
          }

          while (true) {
            const checks = prChecks();
            const runs = headRuns();
            const unreadable = checks === null || runs === null;

            const others = (checks ?? []).filter((check) => check.workflow !== self);
            const otherRuns = (runs ?? []).filter((run) => run.name !== self);
            const pendingChecks = others.filter((c) => c.bucket === 'pending');
            const pendingRuns = otherRuns.filter((r) => r.status !== 'completed');

            if (!unreadable) {
              const failing = others.filter((c) => c.bucket === 'fail' || c.bucket === 'cancel');
              if (failing.length > 0) {
                const red = baseRed();
                const preexisting = failing.filter((c) => red.has(c.name));
                const regressions = failing.filter((c) => !red.has(c.name));

                if (preexisting.length > 0) {
                  const names = preexisting.map((c) => c.name).join(', ');

                  // A check already red on the base was not broken by this update, and blocking
                  // every bump on it would stall security fixes for as long as the default branch
                  // stays red - which is the reason this exemption exists. But spending it on
                  // routine updates means that the moment the base goes red, auto-merge stops
                  // verifying anything at all and waves each following bump straight through:
                  // one broken merge turns into a cascade, and the second failure is invisible
                  // because the first one is now the excuse for it. The exemption is therefore
                  // spent only where it was earned - on an update that carries an advisory.
                  if (securityAdvisory === '') {
                    console.log(`::error::The base commit ${baseSha} is already red (${names}), so this routine update has not been verified against a passing baseline. Refusing to merge - repair the base branch first.`);
                    process.exit(1);
                  }

                  console.log(`::notice::Ignoring ${preexisting.length} check(s) already failing on the base commit ${baseSha} (${names}): this update carries advisory ${securityAdvisory} and must not be stalled by a red base.`);
                }
                if (regressions.length > 0) {
                  const names = regressions.map((c) => `${c.workflow}/${c.name}=${c.state}`).join(', ');
                  console.log(`::error::Checks that pass on the base commit fail here, refusing to merge: ${names}`);
                  process.exit(1);
                }
              }

              if (others.length > 0 && pendingChecks.length === 0 && pendingRuns.length === 0) {
                console.log(`Resolved all ${others.length} repository check(s); no regression against the base commit.`);
                break;
              }
            }

            let reason;
            if (unreadable) {
              reason = 'the check state could not be read';
            } else if (others.length === 0 && otherRuns.length === 0) {
              reason = 'no repository check has attached to this pull request yet';
            } else {
              const names = [
                ...pendingChecks.map((c) => `${c.workflow}/${c.name}`),
                ...pendingRuns.filter((r) => !others.some((c) => c.workflow === r.name)).map((r) => `${r.name}=${r.status}`),
              ];
              reason = `${names.length} check(s) still running: ${names.join(', ')}`;
            }

            if (Date.now() >= deadline) {
              console.log(`::error::Timed out after ${TIMEOUT_MS / 60000} minutes waiting for this repository's own checks, refusing to merge - ${reason}.`);
              process.exit(1);
            }

            console.log(`Waiting: ${reason}.`);
            sleep(POLL_MS);
          }
          NODE

  # A pre-1.0 minor is held for review rather than closed. Closing would only make Dependabot
  # recreate it on the next run and the repository would churn through the same rejection every
  # week; a major is closed because "ignore this major version" can silence it permanently,
  # which has no equivalent for a 0.x minor. Leaving it open and labelled puts the breaking
  # change in front of a human, which is the only thing that can actually judge it.
  hold-zerover-minor:
    needs: classify
    if: needs.classify.outputs.zerover-minor == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label and explain the hold
        run: |
          gh label create pre-1.0-minor \
            --description 'Pre-1.0 minor bump held from auto-merge; breaking under semver' \
            --color D93F0B --force

          gh pr edit "$PR_URL" --add-label pre-1.0-minor

          # The workflow re-runs on every synchronize, so the comment is posted at most once.
          if gh pr view "$PR_URL" --json comments \
             --jq '.comments[].body' | grep -q 'held from auto-merge'; then
            echo "Hold comment already present; not repeating it."
            exit 0
          fi

          # A heredoc keeps the body flush left: indented continuation lines would be rendered
          # as a Markdown code block.
          cat > /tmp/hold-comment.md <<EOF
          This update is **held from auto-merge**: it moves a pre-1.0 dependency across a minor version ($ZEROVER_NAMES).

          Dependabot classifies versions positionally, so \`0.x\` to \`0.y\` is reported as \`semver-minor\` and the repository's major-version ignore does not apply. Under semver a 0.x minor is a breaking release, and Dependabot also rewrites the manifest constraint, removing the caret guard that would otherwise have refused the resolve.

          Review the upstream changelog for breaking changes, migrate any configuration or API the bump requires, and merge by hand.
          EOF

          sed -i 's/^          //' /tmp/hold-comment.md
          gh pr comment "$PR_URL" --body-file /tmp/hold-comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ZEROVER_NAMES: ${{ needs.classify.outputs.zerover-names }}

  auto-merge:
    needs:
      - classify
      - audit
      - wait-for-checks
    if: >-
      needs.wait-for-checks.result == 'success' &&
      needs.classify.outputs.zerover-minor != 'true' &&
      (needs.classify.outputs.update-type == 'version-update:semver-patch' ||
      needs.classify.outputs.update-type == 'version-update:semver-minor')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A stale branch cannot be squashed, and no amount of retrying fixes that: only
      # Dependabot can rebase its own branch. Ask it to, and let the resulting
      # synchronize event run this workflow again from the top.
      - name: Squash-merge audited update
        run: |
          if gh pr merge --squash "$PR_URL"; then
            exit 0
          fi

          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus || echo UNKNOWN)
          echo "Merge failed with mergeStateStatus=$state"

          case "$state" in
            BEHIND)
              # Same permission gap as the major-version ignore command below: this is
              # rejected when DEPENDABOT_COMMAND_TOKEN is not set, since Dependabot does
              # not recognize github-actions[bot] as having push access. Harmless when
              # rejected - the next Dependabot sync retries this workflow regardless -
              # and it starts working with no other change if that secret is added.
              gh pr comment "$PR_URL" --body '@dependabot rebase'
              echo "::notice::Branch was behind the base; asked Dependabot to rebase."
              ;;
            DIRTY)
              echo "::error::Branch conflicts with the base branch and needs manual attention."
              ;;
          esac

          exit 1
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_COMMAND_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

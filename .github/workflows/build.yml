name: Build bootc image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - image.env
      - system_files/**
      - build_files/**
      - tooling/**
      - Justfile
      - docs/**
      - README.md
      - AGENTS.md
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Containerfile
      - image.env
      - system_files/**
      - build_files/**
      - tooling/**
      - Justfile
      - docs/**
      - README.md
      - AGENTS.md
      - .github/workflows/build.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootc-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/workstation-os-image
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/workstation-os-image-cache
  # The base reference lives in the Containerfile, digest-pinned, and is read
  # from there at build time -- see the "Resolve the pinned base" step. A
  # repository variable still overrides it for emergencies.
  BASE_IMAGE_OVERRIDE: ${{ vars.BASE_IMAGE }}

jobs:
  image-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out repository history
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect image input changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == schedule || \
                "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              Containerfile image.env system_files build_files \
              .github/workflows/build.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  repo-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.57.0"

      - name: Repository gates
        run: |
          tooling/validate/repo
          tooling/validate/image-build
          tooling/validate/sources
          # Formatting and parse of the Justfile. These live in
          # tooling/validate/all, which needs the live workstation, so CI never
          # reached them -- and just is already on PATH here for the recipe gate.
          just --fmt --check --unstable
          just --list >/dev/null

      - name: Image identity matches this repository
        run: |
          set -a; . ./image.env; set +a
          if [[ "$IMAGE_REF" != "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}" ]]; then
            echo "IMAGE_REF is $IMAGE_REF but image.env names $IMAGE_NAME;" \
                 "the workflow env and image.env have drifted." >&2
            exit 1
          fi
          if [[ "$REPO_ORGANIZATION" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "image.env REPO_ORGANIZATION=$REPO_ORGANIZATION but this repo is" \
                 "owned by $GITHUB_REPOSITORY_OWNER; the signing scope would not" \
                 "match the published image." >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify every input image before building on it
        run: tooling/validate/source-images

      - name: Verify the vendored RPM signing keys
        run: tooling/validate/rpm-keys

      - name: Shell lint
        run: |
          mapfile -t files < <(
            find tooling build_files system_files/usr/bin system_files/usr/libexec -type f \
              \( -perm /111 -o -name '*.sh' \) -print | sort
          )
          # Pinned container, like hadolint, actionlint and gitleaks in lint.yml.
          # apt's shellcheck was the last unpinned tool in this workflow, and a
          # silent version rollover here presents as a new finding on an
          # unchanged tree. v0.9.0 is what noble currently ships, so this is a
          # no-op today and reproducible tomorrow.
          #
          # -x with the same source path as tooling/validate/all, or the
          # source= directives these scripts carry are inert here and a sourced
          # library resolves locally while reporting SC1091 in CI.
          # This does NOT make the two runs identical: the file list below is
          # narrower than validate/all's, which also lints the chezmoi scaffold
          # scripts and the AI bundle, and this 0.9.0 pin is not the version a
          # given machine has. Do not claim they cannot diverge.
          docker run --rm -v "$PWD":/repo:ro -w /repo \
            docker.io/koalaman/shellcheck:v0.9.0 \
            -x --source-path=SCRIPTDIR "${files[@]}"

  dms-settings-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install --yes jq

      - name: Test DMS preference lifecycle
        env:
          DMS_SETTINGS_SPEC: ${{ github.workspace }}/tooling/fixtures/dms-settings-spec.js
        run: tooling/dms/test

  build:
    needs: [image-inputs, dms-settings-tests, repo-gates]
    if: needs.image-inputs.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        id: ghcr_login
        # Not on pull_request: this job carries packages: write, and a PR never
        # pushes. The cache package pulls anonymously.
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Resolve the pinned base
        run: |
          # Single source of truth: the Containerfile's own ARG. CI passing a
          # different reference than the file declares is how the tag ended up
          # doubled as ":latest:latest" before.
          resolved="${BASE_IMAGE_OVERRIDE:-$(sed -n 's/^ARG BASE_IMAGE=//p' Containerfile)}"
          echo "BASE_IMAGE=$resolved" >> "$GITHUB_ENV"
          echo "building on $resolved"

      - name: Build image with registry cache
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cache_args=(--layers)

          # A scheduled build always refreshes DNF metadata and packages. Other
          # builds may consume the latest cache for up to 25 hours.
          if [[ "$EVENT_NAME" != schedule ]]; then
            cache_args+=(--cache-from "$CACHE_IMAGE" --cache-ttl 25h)
          fi
          if [[ "$EVENT_NAME" != pull_request ]]; then
            cache_args+=(--cache-to "$CACHE_IMAGE")
          fi

          # :$GITHUB_SHA alone is not durable: the nightly cron rebuilds main's
          # HEAD and overwrites it, and those images differ because the desktop
          # stack floats on COPR HEAD and the scheduled build skips the cache.
          # BUILD_TAG is unique per run, so every published image stays
          # addressable for rollback.
          BUILD_TAG="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

          # Identity comes from image.env, the same file the image bakes and the
          # build scripts source. Safe to source here only because the workflow's
          # own full reference is IMAGE_REF, not IMAGE_NAME.
          set -a; . ./image.env; set +a

          buildah bud \
            --file Containerfile \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "IMAGE_NAME=$IMAGE_NAME" \
            --build-arg "REPO_ORGANIZATION=$REPO_ORGANIZATION" \
            --build-arg "IMAGE_DESC=$IMAGE_DESC" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE_REF:$GITHUB_SHA" \
            --tag "$IMAGE_REF:$BUILD_TAG" \
            "${cache_args[@]}" \
            .

      - name: Diff the package manifest against the published image
        continue-on-error: true
        run: |
          # The image bakes a sorted NEVRA manifest. Until now nothing read it.
          # The desktop stack floats permanently -- COPR prunes superseded
          # builds, so versionlock is impossible -- which makes this diff the
          # substitute for pinning: it turns "the desktop broke this week" into
          # "niri went 26.04 to 26.05 on Tuesday".
          m=/usr/share/workstation-os-image/package-manifest.txt
          podman run --rm "$IMAGE_REF:$GITHUB_SHA" cat "$m" > /tmp/new.txt

          # Read the PUBLISHED image by digest, never by tag.
          #
          # `buildah bud` also tagged the fresh build "$IMAGE_REF:latest"
          # locally, and podman's default pull policy is `missing`, so
          # `podman run "$IMAGE_REF:latest"` resolved to the image just built
          # without touching the registry. /tmp/old.txt and /tmp/new.txt were
          # therefore the same manifest and this step printed "No package
          # changes." on every run since it was written -- the one signal that
          # substitutes for pinning was asserting the thing it exists to
          # disprove. The local tag is gone (nothing else consumed it; the push
          # publishes :$GITHUB_SHA and :$BUILD_TAG, and :latest is a
          # registry-to-registry copy of the signed digest) and the lookup is by
          # digest, which local storage cannot shadow with different content.
          #
          # Three outcomes, not two: a first build legitimately has no :latest
          # to diff against, while an unreadable :latest is a broken diff. Both
          # used to print the same line, and continue-on-error means nothing
          # else would notice. On a pull_request the GHCR login is deliberately
          # skipped, so these reads are anonymous and an auth error is the
          # realistic way it happens.
          have_old=false
          if old_digest="$(skopeo inspect --no-tags --format '{{ .Digest }}' \
                "docker://$IMAGE_REF:latest" 2>/tmp/inspect.err)"; then
            latest_exists=yes
            if podman pull -q "$IMAGE_REF@$old_digest" >/dev/null 2>&1 \
               && podman run --rm "$IMAGE_REF@$old_digest" cat "$m" > /tmp/old.txt 2>/dev/null; then
              have_old=true
            fi
          else
            latest_exists=no
          fi

          if [[ $have_old == false ]]; then
            inspect_err="$(cat /tmp/inspect.err 2>/dev/null)"
            if [[ $latest_exists == yes ]]; then
              reason=":latest is $old_digest but its manifest could not be read"
            else
              case $inspect_err in
                *"manifest unknown"* | *"name unknown"* | *"not found"*)
                  reason="" ;;
                *)
                  reason=":latest was unreadable ($inspect_err)" ;;
              esac
            fi

            if [[ -z $reason ]]; then
              echo "No previously published manifest to compare against." \
                >> "$GITHUB_STEP_SUMMARY"
            else
              # Loud, because a skipped diff must not read like a clean one.
              echo "::warning::package diff skipped -- $reason"
              echo "**Package diff skipped:** $reason" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          {
            echo "## Package changes since the last published image"
            echo
            if diff -q /tmp/old.txt /tmp/new.txt >/dev/null; then
              echo "No package changes."
            else
              echo '```diff'
              diff -U0 /tmp/old.txt /tmp/new.txt | grep -E '^[+-][^+-]' | sort -k1.2 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the built image
        run: |
          # Runs BEFORE the push: this is the gate that stops a broken image being
          # published, and it spent one commit sitting after push, sign and :latest,
          # where it could only report a fact already shipped.
          #
          # Every assertion this step used to make now lives in
          # build_files/99-check-build.sh, which runs INSIDE the build and is
          # therefore reachable from `just build` too. Nothing mutates the image
          # between that script and this push -- no rechunk, no relabel -- so a
          # second copy out here could only drift.
          #
          # What is left is the one thing check-build cannot prove about itself:
          # that the published artifact can be instantiated at all. The manifest
          # diff above carries continue-on-error, so without this an image that
          # cannot start would still be published.
          podman run --rm "$IMAGE_REF:$GITHUB_SHA" true

          # Group provisioning cannot be asserted from inside the build: it needs a
          # real useradd, and 99-check-build.sh mutates nothing. It also fails
          # SILENTLY -- usermod resolves a group through NSS to validate the name but
          # only ever writes /etc/group, so a group living solely in /usr/lib/group
          # makes usermod exit 0 having joined nobody. That is the normal state here,
          # since 90-cleanup.sh relocates build-created accounts to /usr/lib.
          podman run --rm "$IMAGE_REF:$GITHUB_SHA" bash -euo pipefail -c '
            useradd -m -u 1000 ciuser
            /usr/libexec/workstation-configure-user-groups
            for g in docker input; do
              id -nG ciuser | tr " " "\n" | grep -qx "$g" \
                || { echo "ciuser did not join $g"; id ciuser; exit 1; }
            done
            echo "group provisioning ok: $(id -nG ciuser)"
          '

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          # :latest is deliberately NOT pushed here. policy.json on the machine
          # requires a signature for this scope, so a failure between push and
          # sign would leave a published :latest that uupd refuses to pull, and
          # the machine stuck until the next green build. Sign first, then move
          # the tag -- see the two steps below.
          #
          # Layers go out gzip, which is buildah's default. zstd was tried here
          # and published exactly zero zstd layers, because
          # `--force-compression=false` does not mean "leave the base's blobs
          # alone" -- it means "reuse any blob the destination already has, in
          # whatever format it already has it". The step above pushes these same
          # layers to $CACHE_IMAGE, a sibling GHCR package under the same owner,
          # and GHCR mounts blobs across repositories, so TryReusingBlob found
          # all 266 already present as gzip and took them verbatim. The push
          # logged no "Copying blob" line and finished in 23 seconds.
          #
          # Forcing it (`--force-compression=true`) is the only way to pin the
          # encoding, and it recompresses all 266 layers rather than our six:
          # one full re-download for every machine, ~4 GB of upload per build,
          # and -- the unresolved part -- containers/image takes zstd encoder
          # concurrency from the CPU count on some paths, so if that varies
          # between runners the BASE's 259 blobs churn every build and the
          # nightly fetch goes UP, from ~0.9 GB to ~3.2 GB. Settle that with two
          # consecutive builds before reaching for it.
          #
          # See docs/design-records/upgrade-download-size.md.
          push_retry() {
            for attempt in 1 2 3; do
              buildah push "$1" "docker://$1" && return 0
              echo "push of $1 failed (attempt $attempt/3); retrying" >&2
              sleep $(( attempt * 5 ))
            done
            return 1
          }
          push_retry "$IMAGE_REF:$GITHUB_SHA"
          push_retry "$IMAGE_REF:$BUILD_TAG"

          # The two tags are one image, and only the first is signed: the sign
          # step resolves the digest of :$GITHUB_SHA and cosign signs that. If a
          # re-encode ever made the second manifest differ, :$BUILD_TAG -- the
          # rollback target, the whole reason it exists -- would be unsigned and
          # so unpullable under the machine's policy.json, and nothing would say
          # so until a rollback was actually needed.
          sha_digest="$(skopeo inspect --no-tags "docker://$IMAGE_REF:$GITHUB_SHA" --format '{{ .Digest }}')"
          tag_digest="$(skopeo inspect --no-tags "docker://$IMAGE_REF:$BUILD_TAG" --format '{{ .Digest }}')"
          [[ -n $sha_digest && $sha_digest == "$tag_digest" ]] || {
            echo "the two pushed tags resolved to different digests: $sha_digest vs $tag_digest" >&2
            exit 1
          }
          echo "both tags resolve to $sha_digest"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign the published image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cosign uses go-containerregistry, which reads ~/.docker/config.json.
          # `buildah login` writes $XDG_RUNTIME_DIR/containers/auth.json instead,
          # so cosign is unauthenticated despite the earlier login and the
          # signature push fails with UNAUTHORIZED.
          echo "$COSIGN_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # Sign the digest, not the tag: a tag can move, a digest cannot.
          digest="$(skopeo inspect --no-tags "docker://$IMAGE_REF:$GITHUB_SHA" --format '{{ .Digest }}')"
          [[ -n $digest ]] || { echo "could not resolve the pushed digest" >&2; exit 1; }
          echo "SIGNED_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "signing $IMAGE_REF@$digest"

          # --new-bundle-format=false: bootc and rpm-ostree read the legacy
          # simple-signing attachment, not the new bundle format.
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE_REF@$digest"

          # Verify what we just published against the in-repo public key, so a
          # key or format mismatch fails the job rather than shipping an image
          # the machine will refuse to pull.
          cosign verify --new-bundle-format=false \
            --key cosign.pub "$IMAGE_REF@$digest" >/dev/null
          echo "signature verified against cosign.pub"

      - name: Publish :latest
        if: github.event_name != 'pull_request'
        run: |
          # Copy from the digest that was signed and verified above, rather than
          # pushing :latest again from local storage. A second push produces the
          # same digest by construction, not by definition -- nothing asserted
          # the two matched, and policy.json on the machine rejects any :latest
          # that is not the signed one. skopeo copy makes it the same image by
          # definition, and moves no blobs since they are already in the registry.
          for attempt in 1 2 3; do
            skopeo copy \
              "docker://$IMAGE_REF@$SIGNED_DIGEST" \
              "docker://$IMAGE_REF:latest" && break
            echo "publishing :latest failed (attempt $attempt/3); retrying" >&2
            sleep $(( attempt * 5 ))
            [[ $attempt == 3 ]] && exit 1
          done

          # Prove it, rather than trusting the copy.
          published="$(skopeo inspect --no-tags "docker://$IMAGE_REF:latest" --format '{{ .Digest }}')"
          [[ "$published" == "$SIGNED_DIGEST" ]] \
            || { echo ":latest is $published but the signed digest is $SIGNED_DIGEST" >&2; exit 1; }
          echo ":latest resolves to the signed digest $SIGNED_DIGEST"

      - name: Log out of GHCR
        # Tear down exactly when the login ran, keyed off the login step rather
        # than a second copy of its event predicate. `buildah logout` exits 125
        # with "not logged into ghcr.io" when no credential is stored, so an
        # unpaired teardown reddens a job whose real work all succeeded.
        # Re-deriving `github.event_name != 'pull_request'` here would restate
        # the policy in two places, and 4921e7e already demonstrated the failure
        # mode: it guarded the login and left this step behind. outcome is
        # 'skipped' when the login did not run and 'failure' if it did not take,
        # so this covers both.
        if: always() && steps.ghcr_login.outcome == 'success'
        run: |
          buildah logout ghcr.io
          # The signing step opens a SECOND store: `cosign login` writes the
          # token into ~/.docker/config.json, which buildah logout does not
          # touch. Ephemeral runner, so this is hygiene rather than exposure,
          # but a step called "Log out of GHCR" should mean it. `docker logout`
          # exits 0 when there is no entry, unlike buildah, so it needs no
          # guard even on the runs where signing never happened.
          docker logout ghcr.io

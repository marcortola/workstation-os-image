# Vendored from a reviewed upstream dev-flow plugin and adapted for this image.
#
# `platforms` upstream reads ["macos"]; herdr links such a plugin without
# complaint but refuses every action at invoke time with
# `platform_unsupported ... (linux)`, so the field must name this platform.
id = "dev.flow"
name = "Dev flow"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Worktree bootstrap and dev pane layout"
platforms = ["linux", "macos"]

[[actions]]
id = "layout"
title = "Apply dev layout"
contexts = ["workspace"]
command = ["./layout.sh"]

# The second layout: one tab, the agent pinned to a third of the width, the
# editor stacked over the terminal in the rest. The action above stays the
# default and is also what takes this one apart again.
[[actions]]
id = "layout-split"
title = "Apply split layout"
contexts = ["workspace"]
command = ["./layout-split.sh"]

[[actions]]
id = "adopt-worktrees"
title = "Open worktrees of every repo"
contexts = ["workspace"]
command = ["./adopt-worktrees.sh"]

# The second propagation net for a herdr-created checkout; the committed
# .worktreeinclude and the post-checkout hook remain the first.
[[events]]
on = "worktree.created"
command = ["./worktree-setup.sh"]

# Recency has to be recorded as it happens. herdr reports agent state but never
# a time -- `agent list` carries a counter, `state_change_seq`, and nothing
# else -- so this hook is the only clock behind the picker's "just finished"
# mark, its expiry window, and whether the dev layout resumes the conversation.
[[events]]
on = "pane.agent_status_changed"
command = ["./agent-freshness.sh"]

[[startup]]
command = ["./adopt-worktrees.sh"]

[[startup]]
command = ["./window-title.sh"]

[[events]]
on = "workspace.focused"
command = ["./window-title.sh"]

[[events]]
on = "workspace.renamed"
command = ["./window-title.sh"]

gui:
  # Open with the focused panel already enlarged; + and - toggle live.
  screenMode: "half"
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - cyan
      - bold
    inactiveBorderColor:
      - black
    searchingActiveBorderColor:
      - magenta
      - bold
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - black
    inactiveViewSelectedLineBgColor:
      - black
    cherryPickedCommitFgColor:
      - blue
    cherryPickedCommitBgColor:
      - cyan
    markedBaseCommitFgColor:
      - blue
    markedBaseCommitBgColor:
      - yellow
    unstagedChangesColor:
      - red
    defaultFgColor:
      - white

# `-` becomes the mirror of `+` for screen size, which costs two defaults: the
# files panel had it on collapseAll, and the branches panel on
# checkoutPreviousBranch. Collapsing the whole tree is not worth a top-row key,
# so both tree toggles are released; checkoutPreviousBranch moves to the `_`
# that prevScreenMode vacated.
keybinding:
  universal:
    prevScreenMode: "-"
  files:
    collapseAll: "<disabled>"
    expandAll: "<disabled>"
  branches:
    checkoutPreviousBranch: "_"

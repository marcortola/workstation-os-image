# tuned ships these two directories inside the image. /var is applied at initial
# provisioning and never again, so without tmpfiles entries they would be frozen
# at whatever the first deploy wrote -- and `bootc container lint
# --fatal-warnings` rejects the omission outright. Entries are the lint's own
# suggested output.
d /var/lib/tuned 0755 root root - -
d /var/log/tuned 0755 root root - -

# Give the greeter a valid theme before any user has logged in.
#
# L+ (replace what is there) rather than plain L (create only if absent), so
# every boot resets these to the image-owned defaults. Plain L existed to let
# `dms greeter sync` repoint them at the logged-in user's real files. That is
# exactly what must not be allowed: it puts a file the greeter does not own, in
# a home the greeter cannot control, on the one path whose failure costs a
# graphical login.
#
# DMS rewrites ~/.config/DankMaterialShell/settings.json atomically, and the new
# inode lands as mode 0600 owned by the user -- dropping the group `dms greeter
# sync` had set on the old one. /usr/bin/dms-greeter runs `set -e`, and its
# cursor-theme lookup is written `theme=$(jq ... 2>/dev/null)`, so an unreadable
# target makes jq exit 2, kills the greeter before it ever starts niri, and logs
# nothing. It happened on 2026-08-29 and surfaced two days later, as a text
# console at the next boot.
#
# L+ also repairs a link plain L could never fix: dms-colors.json was still
# resolving into the upstream share tree the base swap removed, and had been
# dangling ever since without anything noticing.
#
# These are image-owned defaults, deliberately NOT the chezmoi seed tree --
# DMS regenerates settings.json, session.json and dms-colors.json at runtime,
# so they must never become chezmoi-managed targets. Nothing captures them
# either; they are hand-maintained in system_files, which is what keeps the
# login path free of live account state.
L+ /var/cache/dms-greeter/settings.json   - greeter greeter - /usr/share/workstation-os-image/greeter/settings.json
L+ /var/cache/dms-greeter/session.json    - greeter greeter - /usr/share/workstation-os-image/greeter/session.json
L+ /var/cache/dms-greeter/dms-colors.json - greeter greeter - /usr/share/workstation-os-image/greeter/dms-colors.json
L+ /var/cache/dms-greeter/colors.json     - greeter greeter - /usr/share/workstation-os-image/greeter/dms-colors.json

# greetd's %post masks the portal for its own user with a symlink to /dev/null
# under /var/lib/greetd. Content in /var is applied at initial provisioning and
# never on upgrade, so without these the mask is frozen at whatever the first
# deploy wrote. Entries are bootc container lint's own suggested output.
d /var/lib/greetd/.config 0755 greetd greetd - -
d /var/lib/greetd/.config/systemd 0755 greetd greetd - -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd - -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null

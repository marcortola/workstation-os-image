# fcitx5 is installed in full and fcitx5.service is enabled, but without these
# the input method engaged in almost nothing: Wayland-native toolkits reach it
# over text-input-v3, while XWayland clients, SDL and GLFW all need to be told
# which IM to talk to.
#
# environment.d rather than /etc/profile.d, which is where the previous base
# put them: the session is niri.service under the systemd user manager, not a
# login shell, so profile.d never reaches the compositor or anything it spawns.
# 40-workstation-editor.conf is here for the same reason.
#
# GTK_IM_MODULE is deliberately empty. Setting it to "fcitx" forces GTK down the
# legacy module path and breaks the Wayland protocol it would otherwise use.
IMSETTINGS_MODULE=fcitx
INPUT_METHOD=fcitx
QT_IM_MODULE=fcitx
SDL_IM_MODULE=fcitx
GLFW_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
GTK_IM_MODULE=

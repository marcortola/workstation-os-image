# dsearch is RPM-owned and WantedBy=default.target, and our user-preset enables
# it, so it also starts in the user manager pam_systemd creates for greetd's
# `greeter` account. That home is read-only, so it dies on
# `failed to open index: mkdir /.cache: read-only file system` -- and it carries
# Restart=on-failure, so it crash-loops for as long as the login screen is up.
[Unit]
ConditionUser=!@system

# RPM-owned unit that our user-preset enables globally, so it also starts in the
# user manager pam_systemd creates for greetd's `greeter` account. That home is
# read-only, and this unit's whole job is to write into it
# (xdg-user-dirs-update creates the directories and ~/.config/user-dirs.dirs),
# so it is the one with a real failure to report rather than a wasted start.
[Unit]
ConditionUser=!@system

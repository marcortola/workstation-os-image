# RPM-owned unit that our user-preset enables globally, so it also starts in the
# user manager pam_systemd creates for greetd's `greeter` account. That home is
# read-only. Lower risk than dsearch (these are WantedBy=graphical-session.target,
# which the greeter never reaches) but the omission was unintentional.
[Unit]
ConditionUser=!@system

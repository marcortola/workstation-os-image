# RPM-owned unit that our user-preset enables globally, so it also starts in the
# user manager pam_systemd creates for greetd's `greeter` account. The greeter
# runs dms-greeter, a different binary, so dms.service has nothing to do there.
# Same class as the fcitx5, iio-niri and udiskie drop-ins; this one was simply
# missed, and the ConditionUser coverage gate in 99-check-build.sh now says so.
[Unit]
ConditionUser=!@system

# RPM-owned unit that our user-preset enables globally, so it also starts in the
# user manager pam_systemd creates for greetd's `greeter` account. Unlike the
# graphical-session.target units, this one is WantedBy=default.target and its
# socket WantedBy=sockets.target, both of which the greeter's manager DOES
# reach -- so without this it really does run an agent for the greeter.
[Unit]
ConditionUser=!@system

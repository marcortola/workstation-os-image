# Image-owned greetd configuration.
#
# Shipped directly into /etc rather than via /usr/share/factory plus a tmpfiles
# symlink, which is what the previous base did: its `L /etc/greetd/config.toml`
# line never fired, because the greetd RPM already ships that path as a %config
# file, so the symlink was never created and the live file came from
# `dms greeter install` instead.
#
# NOTE for existing machines: ostree three-way-merges /etc and keeps locally
# modified files, so if `rpm -V greetd` reports this path as modified, this
# file will not land on upgrade. Fix it by REPLACING the local file's contents
# -- for example `cp /usr/etc/greetd/config.toml /etc/greetd/config.toml`.
#
# Do NOT `rm` the local copy expecting the image version to take its place.
# ostree records a local deletion as a local modification too, so the merge
# honours the removal, greetd finds no config, and the boot lands on a text
# console with `i/o error: No such file or directory`. That is not theoretical;
# it is how this comment came to be rewritten.
#
# There is deliberately no [general] service line. greetd-spawn existed
# upstream to force XDG_SESSION_TYPE=wayland via pam_env, but the session is
# already Type=wayland without it, so the extra PAM stack is dead weight around
# the one path that must never break.

[terminal]
vt = 1

[default_session]
command = "/usr/bin/dms-greeter --command niri --cache-dir /var/cache/dms-greeter -C /etc/greetd/niri/config.kdl"
user = "greeter"

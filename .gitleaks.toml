# gitleaks configuration.
#
# The CI secret scan runs `gitleaks dir .`, which auto-loads this file. It
# extends the default ruleset (does not replace it) and allowlists a single
# false positive: the keyd source tarball's SHA-256 pinned in the Containerfile.
# gitleaks' generic-api-key rule matches it only because the ARG name contains
# "key" (from "keyd") adjacent to a high-entropy value; it is a public build
# checksum, not a secret.

[extend]
useDefault = true

[[allowlists]]
description = "keyd source tarball SHA-256 (public build checksum, not a secret)"
paths = ['''^Containerfile$''']
regexes = ['''697089681915b89d9e98caf93d870dbd4abce768af8a647d54650a6a90744e26''']

# Same rule, same cause as the entry above: generic-api-key fires on a field
# literally named "key" next to a high-entropy value. Here the values are
# keybinds -- "Mod+Shift+Ctrl+H" and friends -- and "key" is the field name DMS
# requires, so neither side can be renamed.
#
# This is not a hole. The file is generated by
# tooling/keybindings/build-cheatsheet.py from docs/keybindings.md, the niri
# binds and tooling/data/niri-bind-descriptions, and gitleaks scans all three.
# A secret cannot reach the generated sheet without being caught in the source
# it was written into first. targetRules keeps every other rule in force here.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Keybind names in the generated cheatsheet, not credentials"
paths = ['''^system_files/usr/share/workstation-os-image/dotfiles/dot_config/DankMaterialShell/cheatsheets/workstation\.json$''']

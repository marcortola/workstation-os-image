# Give the greeter a valid theme before any user has logged in.
#
# Plain L = create only if absent, which matters: `dms greeter sync` repoints
# these at the logged-in user's real files at runtime, and must be allowed to.
# These are image-owned defaults, deliberately NOT the chezmoi seed tree --
# DMS regenerates settings.json, session.json and dms-colors.json at runtime,
# so they must never become chezmoi-managed targets.
L /var/cache/dms-greeter/settings.json   - greeter greeter - /usr/share/workstation-os-image/greeter/settings.json
L /var/cache/dms-greeter/session.json    - greeter greeter - /usr/share/workstation-os-image/greeter/session.json
L /var/cache/dms-greeter/dms-colors.json - greeter greeter - /usr/share/workstation-os-image/greeter/dms-colors.json
L /var/cache/dms-greeter/colors.json     - greeter greeter - /usr/share/workstation-os-image/greeter/dms-colors.json
